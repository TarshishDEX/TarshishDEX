# cargo-deny configuration for TarshishDEX Soroban contracts.
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Note: cargo-deny >= 0.15 removed the `vulnerability`/`notice`/`severity-threshold`
# fields and changed `unmaintained`/`unsound` to one of all|workspace|transitive|none.
yanked = "deny"
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "ISC",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
]
copyleft = "deny"
default = "deny"

[bans]
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
