name: "Spell Check"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  spellcheck:
    name: cspell
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install cspell
        run: npm install -g cspell@latest
      - name: Run spell check
        run: cspell "**/*.{ts,tsx,md,yml,yaml}" --no-progress --gitignore
