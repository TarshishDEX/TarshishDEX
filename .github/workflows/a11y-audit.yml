name: "Accessibility Audit"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  a11y:
    name: WCAG 2.1 AA audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Start server
        run: |
          npm start &
          sleep 5
          curl --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3000/api/health

      - name: Run axe-core on key pages
        id: axe
        run: |
          set -o pipefail
          echo "=== Accessibility Audit (axe-core WCAG 2.1 AA) ==="
          FAILED=0
          TOTAL_VIOLATIONS=0

          scan_page() {
            local URL="$1"
            local LABEL="$2"
            echo ""
            echo "--- $LABEL ($URL) ---"
            # axe-core exits non-zero when violations found; capture output
            if npx @axe-core/cli "$URL" --exit 2>&1 | tee /tmp/a11y-"$LABEL".txt; then
              echo "  ✅ $LABEL: 0 violations"
            else
              local COUNT=$(grep -c 'Violation of' /tmp/a11y-"$LABEL".txt 2>/dev/null || echo "0")
              TOTAL_VIOLATIONS=$((TOTAL_VIOLATIONS + COUNT))
              FAILED=1
              echo "  ❌ $LABEL: $COUNT violation(s)"
            fi
          }

          scan_page "http://localhost:3000/" "home"
          scan_page "http://localhost:3000/swap" "swap"
          scan_page "http://localhost:3000/markets" "markets"
          scan_page "http://localhost:3000/assets" "assets"

          echo ""
          echo "=== Summary ==="
          echo "total_violations=$TOTAL_VIOLATIONS" >> "$GITHUB_OUTPUT"
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

          if [ "$FAILED" -eq 1 ]; then
            echo "❌ $TOTAL_VIOLATIONS total violation(s) found across all pages"
            exit 1
          else
            echo "✅ All pages pass WCAG 2.1 AA — 0 violations"
          fi

      - name: Generate consolidated report
        if: always()
        run: |
          echo "# Accessibility Audit Report" > a11y-report.md
          echo "" >> a11y-report.md
          echo "**Standard:** WCAG 2.1 AA | **Tool:** axe-core | **Threshold:** 0 violations" >> a11y-report.md
          echo "" >> a11y-report.md
          for page in home swap markets assets; do
            if [ -f "/tmp/a11y-$page.txt" ]; then
              echo "### $page" >> a11y-report.md
              echo '```' >> a11y-report.md
              cat "/tmp/a11y-$page.txt" >> a11y-report.md
              echo '```' >> a11y-report.md
              echo "" >> a11y-report.md
            fi
          done

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-audit-report
          path: a11y-report.md
          retention-days: 30

      - name: Comment PR with a11y results
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always()
        uses: actions/github-script@v7
        with:
          script: |
            const failed = '${{ steps.axe.outputs.failed }}' === '1';
            const violations = '${{ steps.axe.outputs.total_violations }}' || '0';
            const emoji = failed ? '🔴' : '🟢';

            const body = `## ♿ Accessibility Audit\n\n${emoji} **Status:** ${failed ? `${violations} WCAG 2.1 AA violation(s) found` : 'Zero violations — all pages pass WCAG 2.1 AA'}\n\nPages audited: home, swap, markets, assets\nThreshold: **0 violations** (strict)\n\n${failed ? '⚠️ Fix all violations before merging. Download the audit report artifact for details.' : '✅ No accessibility regressions detected.'}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes('Accessibility Audit'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
