name: "Scout Audit (Soroban Vulnerability Scan)"

on:
  push:
    branches: [main]
    paths:
      - "src/contracts/**"
      - ".github/workflows/scout-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/contracts/**"
  schedule:
    - cron: "0 12 * * 1" # Every Monday at 12:00 UTC

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  scout:
    name: Cargo Scout Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/contracts

      # CoinFabrik Scout is a static analyzer for Soroban / ink! / Stellar
      # smart contracts that detects ~40+ vulnerability classes
      # (reentrancy, integer overflow, unsafe unwrap, access control, etc.).
      - name: Install cargo-scout-audit
        run: |
          cargo install cargo-scout-audit --locked
          cargo scout-audit --version

      - name: Run Scout audit
        id: scout
        run: |
          cargo scout-audit --output-format markdown 2>&1 | tee scout-report.md
          # Exit with non-zero if critical/high findings exist
          if grep -qE '^\| (Critical|High) ' scout-report.md 2>/dev/null; then
            echo "⚠️ Critical or High severity findings detected!"
            echo "scout_issues=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ No critical or high severity findings"
            echo "scout_issues=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Scout report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scout-audit-report
          path: src/contracts/scout-report.md
          retention-days: 90

      - name: Comment PR with findings
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = 'src/contracts/scout-report.md';
            if (!fs.existsSync(path)) {
              console.log('No scout report generated');
              return;
            }
            const report = fs.readFileSync(path, 'utf8');
            const status = '${{ steps.scout.outputs.scout_issues }}' === 'true'
              ? '## 🔴 Scout Audit: Issues Found\n\n'
              : '## 🟢 Scout Audit: Clean\n\n';

            const body = status + report.split('\n').slice(0, 50).join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes('Scout Audit'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail on critical findings
        if: steps.scout.outputs.scout_issues == 'true' && github.event_name == 'pull_request'
        run: |
          echo "##[error] Critical or High severity findings in Scout audit. Fix before merging."
          exit 1
