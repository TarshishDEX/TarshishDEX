name: "CI Summary — Fortress Badge"

on:
  workflow_run:
    workflows:
      - CI
      - "Contract Quality Scorecard"
      - "Contract Test Coverage"
      - "Gas Regression"
      - "E2E Smoke Tests"
      - "Contract Fuzz Testing"
      - "Secret Scan"
      - "CodeQL Analysis"
      - "Dependency Audit"
      - "Docker Build"
      - "Component Tests"
      - "API Integration Tests"
      - "Schema Contract Tests"
    types:
      - completed

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  aggregate:
    name: Aggregate all gate results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Query all workflow conclusions
        id: aggregate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.workflow_run.head_sha;
            const branch = context.payload.workflow_run.head_branch || 'main';

            // Every workflow that acts as a quality gate for this repo.
            const GATE_WORKFLOWS = [
              'CI',
              'Contract Quality Scorecard',
              'Contract Test Coverage',
              'Gas Regression',
              'E2E Smoke Tests',
              'Contract Fuzz Testing',
              'Contract Security Audit',
              'Scout Audit (Soroban Vulnerability Scan)',
              'Secret Scan',
              'CodeQL Analysis',
              'Dependency Audit',
              'Docker Build',
              'Component Tests',
              'API Integration Tests',
              'Schema Contract Tests',
              'Coverage Gate',
              'Accessibility Audit',
              'Lighthouse',
              'Bundle Size',
              'Performance Budget',
              'Link Check',
              'Spell Check',
              'Visual Regression',
              'PR Title Check',
            ];

            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              per_page: 100,
            });

            const results = [];
            for (const name of GATE_WORKFLOWS) {
              const run = runs.workflow_runs.find(r => r.name === name);
              if (!run) {
                results.push({ name, conclusion: 'missing', status: 'pending' });
                continue;
              }
              const ok = run.conclusion === 'success' || run.conclusion === 'neutral';
              results.push({
                name,
                conclusion: run.conclusion || 'in_progress',
                status: ok ? 'ok' : run.status !== 'completed' ? 'pending' : 'fail',
              });
            }

            const failed = results.filter(r => r.status === 'fail');
            const pending = results.filter(r => r.status === 'pending');
            const passed = results.filter(r => r.status === 'ok');

            const summary = [
              '## 🏰 Fortress Gate Summary',
              '',
              `| Status | Gates |`,
              `|--------|-------|`,
              `| 🟢 Passing | ${passed.length} |`,
              `| 🟡 Pending / Missing | ${pending.length} |`,
              `| 🔴 Failing | ${failed.length} |`,
              '',
            ];

            if (failed.length > 0) {
              summary.push('### 🔴 Failing gates');
              for (const f of failed) summary.push(`- ${f.name}: \`${f.conclusion}\``);
              summary.push('');
            }
            if (pending.length > 0) {
              summary.push('### 🟡 Not yet completed');
              for (const p of pending) summary.push(`- ${p.name}`);
              summary.push('');
            }

            summary.push('### All gates');
            for (const r of results) {
              const icon = r.status === 'ok' ? '✅' : r.status === 'fail' ? '❌' : '🟡';
              summary.push(`- ${icon} ${r.name} — \`${r.conclusion || r.status}\``);
            }

            const state = failed.length > 0 ? 'failure'
              : pending.length > 0 ? 'pending' : 'success';
            // GitHub's commit-status description rejects 4-byte Unicode (emoji),
            // so keep this ASCII-only.
            const description = `Fortress gates: ${passed.length} pass, ${pending.length} pending, ${failed.length} fail`;

            core.setOutput('state', state);
            core.setOutput('description', description);
            core.setOutput('sha', sha);
            core.setOutput('branch', branch);

            // Job summary for the Actions UI
            await core.summary
              .addRaw(summary.join('\n'))
              .write();

      - name: Set unified commit status
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ steps.aggregate.outputs.state }}';
            const description = '${{ steps.aggregate.outputs.description }}';
            const sha = '${{ steps.aggregate.outputs.sha }}';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              description,
              context: 'fortress-gates',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
