name: "Contract Test Coverage"

on:
  push:
    branches: [main]
    paths:
      - "src/contracts/**"
      - ".github/workflows/contract-coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/contracts/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: cargo-tarpaulin coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/contracts

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage
        id: coverage
        run: |
          cargo tarpaulin --workspace --out Html --out Xml --output-dir coverage 2>&1 | tee coverage.log
          # Extract line coverage percentage
          COV=$(grep -oP '\d+\.\d+%' coverage.log | head -1 | tr -d '%' || echo "0")
          echo "coverage_pct=${COV}" >> "$GITHUB_OUTPUT"
          echo "Contract coverage: ${COV}%"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-coverage
          path: src/contracts/coverage/
          retention-days: 30

      - name: Coverage gate
        run: |
          COV="${{ steps.coverage.outputs.coverage_pct }}"
          # Strip decimal and compare as integer (90% threshold)
          COV_INT=$(echo "$COV" | cut -d. -f1)
          if [ "$COV_INT" -lt 90 ]; then
            echo "##[error] Contract coverage ${COV}% is below 90% threshold"
            exit 1
          fi
          echo "✅ Contract coverage ${COV}% meets 90% threshold"

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const cov = '${{ steps.coverage.outputs.coverage_pct }}';
            const emoji = parseFloat(cov) >= 95 ? '🟢' : parseFloat(cov) >= 90 ? '🟡' : '🔴';
            const body = `## ${emoji} Soroban Contract Coverage: **${cov}%**\n\nThreshold: 90% | ${parseFloat(cov) >= 90 ? '✅ Passing' : '❌ Below threshold'}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes('Contract Coverage'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
