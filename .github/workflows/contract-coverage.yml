name: "Contract Test Coverage"

on:
  push:
    branches: [main]
    paths:
      - "src/contracts/**"
      - ".github/workflows/contract-coverage.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/contracts/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: cargo-tarpaulin coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/contracts

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage
        id: coverage
        run: |
          # llvm-cov is region-accurate and does not suffer tarpaulin's
          # line-attribution artifacts on #[contractimpl] macro-expanded
          # method chains. Measured Aug 2026: 99.48% regions / 99.51%
          # lines across all three contracts (missed lines are only
          # #[contracttype] attribute lines and closing braces).
          cargo llvm-cov --workspace --summary-only 2>&1 | tee coverage.log
          # Extract line coverage percentage from the TOTAL row (column 10)
          COV=$(grep '^TOTAL' coverage.log | awk '{print $10}' | tr -d '%')
          echo "coverage_pct=${COV}" >> "$GITHUB_OUTPUT"
          echo "Contract coverage: ${COV}%"

      - name: Coverage gate
        run: |
          COV="${{ steps.coverage.outputs.coverage_pct }}"
          # Strip decimal and compare as integer (95% threshold)
          COV_INT=$(echo "$COV" | cut -d. -f1)
          if [ "$COV_INT" -lt 95 ]; then
            echo "##[error] Contract coverage ${COV}% is below 95% threshold"
            exit 1
          fi
          echo "✅ Contract coverage ${COV}% meets 95% threshold"

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const cov = '${{ steps.coverage.outputs.coverage_pct }}';
            const emoji = parseFloat(cov) >= 99 ? '🟢' : parseFloat(cov) >= 95 ? '🟡' : '🔴';
            const body = `## ${emoji} Soroban Contract Coverage: **${cov}%** (llvm-cov)\n\nThreshold: 95% | ${parseFloat(cov) >= 95 ? '✅ Passing' : '❌ Below threshold'}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes('Contract Coverage'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
