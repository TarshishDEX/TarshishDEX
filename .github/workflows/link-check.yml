name: "Link Check"

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

jobs:
  check:
    name: Check for broken links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200,301,302,429
            --timeout 15
            --retry-wait-time 5
            --max-retries 2
            --exclude "http://localhost:3000.*"
            "**/*.md"
          fail: true
