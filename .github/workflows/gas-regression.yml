name: "Gas Regression"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/contracts/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Run gas benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/contracts

      - name: Run gas benchmarks
        run: cargo test gas_benchmarks -- --nocapture 2>&1 | tee gas-bench.txt

      - name: Post benchmark results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'src/contracts/gas-bench.txt';
            if (!fs.existsSync(path)) {
              console.log('No benchmark output');
              return;
            }
            const output = fs.readFileSync(path, 'utf8');
            const lines = output.split('\n').filter(l => l.startsWith('[bench]'));
            if (lines.length === 0) return;

            // Parse benchmarks with threshold checks
            const THRESHOLDS = {
              'initialize': 2_000_000,
              'place_order': 3_000_000,
              'cancel_order': 2_000_000,
              'mark_executed': 2_500_000,
            };

            const rows = lines.map(l => {
              const match = l.match(/\[bench\] (.+): (\d+) cpu/);
              if (!match) return '';
              const name = match[1];
              const cost = parseInt(match[2]);
              let flag = '';
              for (const [key, threshold] of Object.entries(THRESHOLDS)) {
                if (name.includes(key) && cost > threshold) {
                  flag = ` ⚠️ >${threshold.toLocaleString()}`;
                  break;
                }
              }
              return `| ${name} | ${cost.toLocaleString()}${flag} |`;
            }).filter(Boolean);

            const table = [
              '## ⛽ Gas Benchmark Results',
              '',
              '| Function | CPU Instructions |',
              '|----------|-----------------|',
              ...rows,
              '',
              '⚠️ Review any significant increases before merging.',
              'Thresholds: init ≤2M, place_order ≤3M, cancel ≤2M, execute ≤2.5M',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes('Gas Benchmark Results'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body: table,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: table,
              });
            }
