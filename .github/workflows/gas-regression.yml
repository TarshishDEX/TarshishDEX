name: "Gas Regression"

on:
  pull_request:
    branches: [main]
    paths:
      - "src/contracts/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    name: Run gas benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/contracts

      - name: Run gas benchmarks
        run: cargo test gas_benchmarks -- --nocapture 2>&1 | tee gas-bench.txt

      - name: Post benchmark results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'src/contracts/gas-bench.txt';
            if (!fs.existsSync(path)) {
              console.log('No benchmark output');
              return;
            }
            const output = fs.readFileSync(path, 'utf8');
            const lines = output.split('\n').filter(l => l.startsWith('[bench]'));
            if (lines.length === 0) return;
            const table = [
              '## ⛽ Gas Benchmark Results',
              '',
              '| Function | CPU Instructions |',
              '|----------|-----------------|',
              ...lines.map(l => {
                const [_, name, cost] = l.match(/\[bench\] (.+): (\d+) cpu/) || [];
                return `| ${name} | ${cost} |`;
              }),
              '',
              '⚠️ Review any significant increases before merging.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes('Gas Benchmark Results'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body: table,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: table,
              });
            }
