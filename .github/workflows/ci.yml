name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  contracts:
    name: Soroban Contracts (fmt, clippy, test, wasm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/contracts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Soroban SDK v27 requires the wasm32v1-none target on Rust 1.82+
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/contracts

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build wasm
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Check WASM sizes (64 KB Stellar limit)
        run: |
          echo "=== WASM binary sizes ==="
          MAX_SIZE=65536
          FAILED=0
          for wasm in target/wasm32v1-none/release/*.wasm; do
            if [ -f "$wasm" ]; then
              SIZE=$(stat -c%s "$wasm")
              NAME=$(basename "$wasm")
              PCT=$(( SIZE * 100 / MAX_SIZE ))
              printf "  %-45s %6d bytes  (%d%% of 64KB)\n" "$NAME" "$SIZE" "$PCT"
              if [ "$SIZE" -gt "$MAX_SIZE" ]; then
                echo "##[error] $NAME exceeds 64 KB Stellar deploy limit ($SIZE bytes)"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "##[error] One or more WASM binaries exceed the 64 KB Stellar limit"
            exit 1
          fi
          echo "✅ All WASM binaries within 64 KB limit"
