name: "Welcome New Contributors"

on:
  pull_request_target:
    branches: [main]
    types: [opened]

permissions:
  pull-requests: write

jobs:
  welcome:
    name: Greet first-time contributor
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-message: |
            👋 **Welcome to TarshishDEX!** Thanks for your first pull request.

            A few quick things:
            - CI runs automatically — wait for all checks to pass.
            - Read our [contributing guide](CONTRIBUTING.md) for conventions.
            - PR titles use [conventional commits](https://www.conventionalcommits.org/) (`feat:`, `fix:`, etc.).

            A maintainer will review your PR soon. Thanks for contributing! 🚀
