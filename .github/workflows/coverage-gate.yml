name: "Coverage Gate"

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Report coverage summary
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'coverage/coverage-summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary found');
              return;
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
            const total = summary.total;
            if (!total) return;

            const lines = total.lines?.pct || 0;
            const branches = total.branches?.pct || 0;
            const functions = total.functions?.pct || 0;
            const statements = total.statements?.pct || 0;

            const table = [
              '## 📊 Coverage Report',
              '',
              '| Metric | Coverage |',
              '|--------|----------|',
              `| Statements | ${statements.toFixed(1)}% |`,
              `| Branches | ${branches.toFixed(1)}% |`,
              `| Functions | ${functions.toFixed(1)}% |`,
              `| Lines | ${lines.toFixed(1)}% |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.body.includes('Coverage Report'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body: table,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: table,
              });
            }
