name: "PR Title Check"

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            chore
            ci
            style
          requireScope: false
          subjectPattern: ^[A-Z].+[^.]$
          subjectPatternError: |
            The subject must start with a capital letter and not end with a period.
            Example: "feat(swap): Add slippage warning threshold"
