<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 96" role="img" aria-label="TarshishDEX">
  <defs>
    <linearGradient id="td-brand" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ba0fd" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Brand mark: rounded tile with gradient border and the T-wave -->
  <rect x="4" y="4" width="88" height="88" rx="24" fill="#0b101c" stroke="url(#td-brand)" stroke-width="4" />
  <path
    d="M27 27h42M48 27v42M48 69c12 0 18-6.6 18-15"
    stroke="url(#td-brand)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Wordmark -->
  <text
    x="112"
    y="63"
    font-family="'Space Grotesk', 'Inter', ui-sans-serif, system-ui, sans-serif"
    font-size="46"
    font-weight="700"
    letter-spacing="-1"
    fill="#94a3b8"
  >Tarshish<tspan fill="url(#td-brand)">DEX</tspan></text>
